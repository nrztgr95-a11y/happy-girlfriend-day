<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Page ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff8fb1,#ff5d8f,#ffc1d9);
background-size:300% 300%;
animation:bg 8s infinite alternate;
}

@keyframes bg{
0%{background-position:left;}
100%{background-position:right;}
}

.box{
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
padding:40px;
border-radius:25px;
text-align:center;
width:90%;
max-width:400px;
box-shadow:0 0 20px rgba(0,0,0,.2);
color:white;
}

h1{
margin-bottom:15px;
}

p{
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:30px;
outline:none;
font-size:18px;
text-align:center;
margin-bottom:20px;
}

button{
padding:15px 35px;
border:none;
border-radius:30px;
background:white;
color:#ff2e75;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#error{
margin-top:20px;
color:#fff;
font-weight:bold;
display:none;
}

.heart{
position:absolute;
bottom:-30px;
font-size:22px;
animation:float linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="box">
<h1>❤️ Secret Surprise ❤️</h1>

<p>Enter the special password.July_ ?. Time-?. Pass pattern- xjuly,xx am/pm..</p>

<input
type="password"
id="pass"
placeholder="Password"
onkeydown="if(event.key==='Enter') checkPassword()">

<button onclick="checkPassword()">Unlock ❤️</button>

<div id="error">
❌ Wrong password! Try again ❤️
</div>

</div>

<script>

const correctPassword="3july,11 pm";

function checkPassword(){

const entered=document.getElementById("pass").value;

if(entered===correctPassword){

window.location.href="home.html";

}else{

document.getElementById("error").style.display="block";

document.getElementById("pass").value="";

}

}

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML=["❤️","💕","💖","💗"][Math.floor(Math.random()*4)];

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*20)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
