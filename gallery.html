<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:linear-gradient(-45deg,#ff6ea5,#ff9bc3,#ffd9e8,#fff2f8);
background-size:400% 400%;
animation:bg 15s ease infinite;
overflow-x:hidden;
min-height:100vh;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Intro Screen */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg,#ff5d8f,#ff8fb3,#ffd6e7);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
color:white;
transition:opacity 2s;
}

#intro h1{
font-size:55px;
text-shadow:0 0 20px white;
animation:pulse 2s infinite;
}

#intro p{
font-size:22px;
margin-top:20px;
opacity:0;
animation:fade 2s forwards;
animation-delay:1s;
}

@keyframes fade{
to{
opacity:1;
}
}

@keyframes pulse{
50%{
transform:scale(1.05);
}
}

/* Main Heading */

.title{
padding-top:70px;
text-align:center;
color:white;
font-size:55px;
text-shadow:0 0 20px #ff2d75;
}

.subtitle{
text-align:center;
color:white;
font-size:20px;
margin-bottom:50px;
}

/* Gallery */

.gallery{
width:92%;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
padding-bottom:70px;
}

.photo{
opacity:0;
transform:translateY(40px);
transition:1s;
overflow:hidden;
border-radius:25px;
background:white;
box-shadow:0 10px 30px rgba(0,0,0,.25);
cursor:pointer;
}

.photo.show{
opacity:1;
transform:translateY(0);
}

.photo img{
width:100%;
height:330px;
object-fit:cover;
transition:.4s;
}

.photo:hover img{
transform:scale(1.1);
}

/* Lightbox */

#lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.92);
justify-content:center;
align-items:center;
z-index:99999;
}

#lightbox img{
max-width:90%;
max-height:90%;
border-radius:20px;
}

.close{
position:absolute;
top:20px;
right:40px;
font-size:55px;
color:white;
cursor:pointer;
}

/* Back Button */

.back{
display:block;
margin:20px auto 50px;
padding:18px 45px;
border:none;
border-radius:50px;
background:white;
font-size:20px;
font-weight:bold;
color:#ff2d75;
cursor:pointer;
transition:.3s;
}

.back:hover{
transform:scale(1.08);
}

/* Floating Hearts */

.float{
position:fixed;
bottom:-50px;
pointer-events:none;
animation:up linear forwards;
}

@keyframes up{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}
   /* ==========================
   MOBILE VIEW
========================== */

@media screen and (max-width:768px){

body{
padding:15px;
overflow-x:hidden;
}

.card{
width:100%;
max-width:100%;
padding:20px;
border-radius:20px;
}

h1{
font-size:36px !important;
}

h2{
font-size:24px !important;
}

p{
font-size:17px !important;
line-height:1.8;
}

button{
width:100%;
padding:16px;
font-size:18px;
margin-top:15px;
}

img{
width:100%;
height:auto;
border-radius:15px;
}

video{
width:100%;
height:auto;
border-radius:15px;
}

.gallery{
grid-template-columns:1fr !important;
gap:18px;
}

.photo img{
height:auto;
max-height:450px;
object-fit:cover;
}

}

@media screen and (max-width:480px){

h1{
font-size:30px !important;
}

h2{
font-size:22px !important;
}

p{
font-size:16px !important;
}

button{
font-size:17px;
padding:15px;
}

}

</style>

</head>

<body>

<!-- Intro -->

<div id="intro">

<h1>❤️ Our Memories ❤️</h1>

<p>Let's relive our beautiful moments together...</p>

</div>

<button class="back" onclick="location.href='home.html'">

</div>

<script>

/* --------------------------
   INTRO ANIMATION
---------------------------*/

window.onload = function(){

    // Wait 4 seconds before removing intro
    setTimeout(function(){

        document.getElementById("intro").style.opacity="0";

        setTimeout(function(){

            document.getElementById("intro").style.display="none";

            // Start all animations
            revealPhotos();
            startGalleryTour();

        },2000);

    },4000);

};


/* --------------------------
   PHOTO FADE-IN
---------------------------*/

function revealPhotos(){

    const photos=document.querySelectorAll(".photo");

    photos.forEach((photo,index)=>{

        setTimeout(()=>{

            photo.classList.add("show");

        },index*500);

    });

}


/* --------------------------
   LIGHTBOX
---------------------------*/

function openImg(src){

    document.getElementById("lightbox").style.display="flex";

    document.getElementById("preview").src=src;

}

function closeImg(){

    document.getElementById("lightbox").style.display="none";

}


/* --------------------------
   FLOATING EFFECTS
---------------------------*/

const emojis=[
"❤️",
"💕",
"💖",
"💞",
"💗",
"🌹",
"🌸",
"✨"
];

function floating(){

    const e=document.createElement("div");

    e.className="float";

    e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

    e.style.left=Math.random()*100+"vw";

    e.style.fontSize=(20+Math.random()*25)+"px";

    e.style.animationDuration=(6+Math.random()*5)+"s";

    document.body.appendChild(e);

    setTimeout(()=>{

        e.remove();

    },12000);

}

setInterval(floating,250);


/* --------------------------
   CINEMATIC AUTO TOUR
---------------------------*/

function startGalleryTour(){

    const bottom = document.documentElement.scrollHeight - window.innerHeight;

    window.scroll({
        top: bottom,
        left: 0,
        behavior: "smooth"
    });

    // Wait for the scroll to finish, then return to top
    setTimeout(() => {

        window.scroll({
            top: 0,
            left: 0,
            behavior: "smooth"
        });

    }, 35000);

}

</script>
